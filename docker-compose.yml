name: hyto

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hyto
      POSTGRES_PASSWORD: hyto
      POSTGRES_DB: hyto
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyto -d hyto"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - hyto-postgres:/var/lib/postgresql/data

volumes:
  hyto-postgres:
